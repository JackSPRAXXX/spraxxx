<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg1" cx="70%" cy="-10%">
      <stop offset="0%" style="stop-color:#192140;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#0b0c11;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="bg2" cx="10%" cy="120%">
      <stop offset="0%" style="stop-color:#112033;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#0b0c11;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#90f2ff" />
      <stop offset="100%" style="stop-color:#8cffc1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0b0c11"/>
  <rect width="1200" height="630" fill="url(#bg1)"/>
  <rect width="1200" height="630" fill="url(#bg2)"/>

  <!-- Badge Icon -->
  <g transform="translate(100, 150)">
    <defs>
      <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#90f2ff" />
        <stop offset="50%" style="stop-color:#8cffc1" />
        <stop offset="100%" style="stop-color:#90f2ff" />
      </linearGradient>
    </defs>
    <rect width="80" height="80" rx="22" fill="url(#badgeGrad)"/>
    <path d="M 30 25 L 30 40 L 20 40 L 40 65 L 60 40 L 50 40 L 50 25 Z" fill="#0b0c11" opacity="0.9"/>
  </g>

  <!-- Title -->
  <text x="210" y="220" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="72" font-weight="900" fill="url(#brandGrad)" letter-spacing="2">
    SPRAXXX
  </text>

  <!-- Subtitle -->
  <text x="100" y="310" font-family="ui-sans-serif, system-ui, sans-serif" font-size="36" font-weight="600" fill="#e9f1ff">
    Verified Email, Identity Keys &amp; Mail-Safe Receipts
  </text>

  <!-- Tagline -->
  <text x="100" y="370" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="400" fill="#9fb0c8">
    Verify once. Stay in control. The inbox that signs its name.
  </text>

  <!-- Features -->
  <g transform="translate(100, 430)">
    <text y="0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" fill="#8cffc1">
      ✓ Cryptographic sender proofs
    </text>
    <text y="45" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" fill="#8cffc1">
      ✓ One identity key for everything
    </text>
    <text y="90" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" fill="#8cffc1">
      ✓ Human override for disputes
    </text>
  </g>
</svg>
